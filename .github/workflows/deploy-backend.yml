name: Deploy
# One Worker serves the whole site (https://app.xavionfitness.in): the React app from frontend/dist
# and the Python API on /api/*; a small second Worker (realtime/) holds the live-update WebSockets. Every push to main rebuilds the app, runs the tests, applies any
# new D1 migrations (already-applied ones are skipped) and deploys. Also runnable by hand:
# GitHub -> Actions -> Deploy -> Run workflow.
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts: Edit, D1: Edit (and Workers Routes: Edit)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns xavionfitness.in
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'realtime/**', '.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # needs Workers Scripts:Edit and D1:Edit
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app (same origin, so VITE_API_URL stays empty)
        run: cd frontend && npm ci && npm run build

      - uses: astral-sh/setup-uv@v3
      - run: cd backend && uv sync
      - name: Tests
        run: cd backend && uv run pytest -q

      - name: Deploy live updates (WebSocket hub; the API binds to it, so it goes first)
        run: cd realtime && npx --yes wrangler@4 deploy

      - name: Apply database migrations
        run: cd backend && npx --yes wrangler@4 d1 migrations apply smartgym --remote
      - name: Deploy app + API
        run: cd backend && uv run pywrangler deploy
